runtime:
  model: ALFTemporal
  model_variant: cond1
  model_recipe: filtered_patch
  t_mark: true

# PEMS-BAY twin of METRLA_cond1.yaml. The family block is copied unchanged
# except for spa_patchsize, which is geometry rather than tuning: the KD-tree
# splits the node set into 2^recur_times parts, and `_reorder_data` pads a part
# up to spa_patchsize but never splits one. Measured at recur_times=5:
#
#   METR-LA   207 nodes -> 32 parts of  6-11 ... max  7  -> spa_patchsize  8
#   PEMS-BAY  325 nodes -> 32 parts of 10-11 ... max 11  -> spa_patchsize 12
#
# The rule is largest part + 1, so every part is padded with at least one
# augmented neighbour -- which is what reproduces METR-LA's existing 8. Nothing
# was searched here; 11 is the minimum that runs at all and 12 is the minimum
# that keeps the padding semantics identical.
# PEMS-BAY is also 5-minute sampling, so tod: 288 still holds.
dataset:
  dloader_name: PEMSBAY
  data_path: ./data/PEMS-BAY/raw_data.pkl
  unknown_nodes_path: ./data/PEMS-BAY/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  input_features: v
  target_features: v

training:
  device: cuda:0
  seed: 32
  loss: mse
  lr: 0.0001
  d_model: 64

family:
  model:
    lifecycle_input: true
    emit: features
    use_timefilter: false
    layers: 1
    tem_patchsize: 12
    tem_patchnum: 1
    recur_times: 5
    spa_patchsize: 12          # geometry, see the header. METR-LA uses 8.
    factors: 1
    crossformer_router_factor: 4
    crossformer_dropout: 0.1
    input_dims: 64
    node_dims: 32
    tod_dims: 32
    dow_dims: 32
    tod: 288
    dow: 7
