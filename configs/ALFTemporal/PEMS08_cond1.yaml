# PEMS08 twin of METRLA_cond1.yaml. The family block is copied unchanged except
# for spa_patchsize, which is geometry rather than tuning: the KD-tree splits
# the node set into 2^recur_times parts and `_reorder_data` pads a part up to
# spa_patchsize but never splits one. Measured at recur_times=5:
#
#   METR-LA   207 nodes -> 32 parts of  6-7  ... max  7  -> spa_patchsize  8
#   PEMS-BAY  325 nodes -> 32 parts of 10-11 ... max 11  -> spa_patchsize 12
#   PEMS08    170 nodes -> 32 parts of  5-6  ... max  6  -> spa_patchsize  7
#
# The rule is largest part + 1, so every part is padded with at least one
# augmented neighbour. PEMS08 is also 5-minute sampling, so tod: 288 holds.
runtime:
  model: ALFTemporal
  model_variant: cond1
  model_recipe: filtered_patch
  t_mark: true

dataset:
  dloader_name: PEMS08
  data_path: ./data/PEMS08/raw_data.pkl
  unknown_nodes_path: ./data/PEMS08/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  input_features: v
  target_features: v

training:
  device: cuda:0
  seed: 32
  loss: mse
  lr: 0.0001
  d_model: 64

family:
  model:
    # Availability one-hot, state_age and observation mask reach the patch
    # expert. Set false for the lifecycle-input ablation.
    lifecycle_input: true
    # Emit a per-node condition vector instead of a second forecast.
    emit: features
    # TimeFilter off: 69% of block time, 23.6% of block params, and its
    # top-p router is non-differentiable in the forward path.
    use_timefilter: false
    # One block: the KD-tree geometric patch prior is the contribution;
    # five copies of it were buying repeats, not new structure.
    layers: 1
    tem_patchsize: 12
    tem_patchnum: 1
    recur_times: 5
    spa_patchsize: 7          # geometry, see the header. METR-LA uses 8.
    factors: 1
    crossformer_router_factor: 4
    crossformer_dropout: 0.1
    input_dims: 64
    node_dims: 32
    tod_dims: 32
    dow_dims: 32
    tod: 288
    dow: 7
