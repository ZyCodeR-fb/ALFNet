runtime:
  model: ALFNet
  model_variant: flow_last_round_20261002_05_PEMS08_degree_supports
  model_recipe: full_mae_tail_v1
  mode: train
  t_mark: true
dataset:
  dloader_name: PEMS08
  data_path: ./data_v4/PEMS08/raw_data.pkl
  unknown_nodes_path: ./data_v4/PEMS08/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 1
  input_features: q
  target_features: q
  freq: min
training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_lifecycle
  batch_size: 64
  num_workers: 0
  loss: mae_focal_raw02
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.0001
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1
  teacher_forcing_mode: linear_decay
  teacher_forcing_decay_epochs: 40
  early_stopping_start_epoch: 40
lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_observation_mask_feature: true
  lifecycle_age_mode: state_duration
  lifecycle_training_strategy: lcbt_v4
  lcbt_validation_seed: 12026
  lcbt_train_end_ratio: 0.6
  lcbt_val_end_ratio: 0.8
  lcbt_test_start_ratio: 0.8
  lcbt_scaler_end_ratio: 0.6
  lcbt_zero_history_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
family:
  experts:
    graph:
      model: ALFGraph
      config_path: configs/paper/flow_extension_20260926/PEMS08_graph.yaml
      checkpoint_path: ''
      load_checkpoint: false
    patch:
      model: ALFTemporal
      config_path: configs/paper/flow_extension_20260926/PEMS08_lr_double_patch.yaml
      checkpoint_path: ''
      load_checkpoint: false
  model:
    state_hidden_dim: 32
    state_dim: 32
    gate_hidden_dim: 32
    graph_refiner_hidden_dim: 32
  recipe:
    graph_expert_lr: 0.001
    patch_expert_lr: 0.0002
    gate_lr: 0.0001
    fusion_mode: film
    forecast_loss_mode: role_balanced_mix
    forecast_role_balanced_beta: 0.1
    graph_diffusion_steps: 1
    graph_diffusion_scale: 0.05
    graph_diffusion_role_scale:
      aas: 0.0
      nas: 1.0
      vs: 1.0
      fs: 0.25
    flow_last_variant: degree_supports
