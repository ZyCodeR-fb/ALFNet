runtime:
  model: STOP
  model_variant: extension_20261103_PEMS08_STOP
  model_recipe: released_source_v4_adapter
  mode: train
  t_mark: true
dataset:
  dloader_name: PEMS08
  data_path: ./data_v4/PEMS08/raw_data.pkl
  unknown_nodes_path: ./data_v4/PEMS08/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 1
  input_features: q
  target_features: q
  freq: min
training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_lifecycle
  batch_size: 64
  num_workers: 0
  loss: mae
  optimizer: adam
  scheduler: None
  scheduler_patience: 1
  lr: 0.002
  weight_decay: 1.0e-05
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1
  early_stopping_start_epoch: 0
lifecycle:
  train_for_async_lifecycle: false
  lifecycle_role_features: false
  lifecycle_history_age_feature: false
  lifecycle_observation_mask_feature: false
  lifecycle_age_mode: state_duration
  lifecycle_training_strategy: lcbt_v4
  lcbt_validation_seed: 12026
  lcbt_train_end_ratio: 0.6
  lcbt_val_end_ratio: 0.8
  lcbt_test_start_ratio: 0.8
  lcbt_scaler_end_ratio: 0.6
  lcbt_zero_history_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
family:
  model: {}
  recipe:
    released_training_recipe:
      optimizer: Adam
      lr: 0.002
      weight_decay: 1.0e-05
      eps: 1.0e-08
      batch_size: 64
      scheduler:
      - MultiStepLR
      - milestones:
        - 30
        - 80
        - 160
        - 250
        gamma: 0.5
