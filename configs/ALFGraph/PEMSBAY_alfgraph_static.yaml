# GENERATED by scripts/build_router_configs.py -- edit the base config instead.
#
# Differs from PEMSBAY_alfgraph_k1.yaml in `moge_router_mode` alone. At the shipped
# `moge_top_k: 1` the default noisy top-k router is not reachable from the
# forecast loss at all: a one-column Softmax is identically 1.0 with zero
# derivative, so `w_gate` is trained only by the load-balance prior. See
# layers/lifecycle_moge.py for the measurements.
runtime:
  model: ALFGraph
  model_variant: alf_gsd_static
  model_recipe: lcbt_v3_graph

# PEMS-BAY twin of METRLA_alfgraph_k1.yaml. Only the dataset block differs:
# every capacity and recipe value is held fixed so the cross-dataset run tests
# generalisation, not a second round of tuning. 325 nodes / 52,116 steps against
# METR-LA's 207 / 34,272; the model reads the node count from the data.
dataset:
  dloader_name: PEMSBAY
  data_path: ./data/PEMS-BAY/raw_data.pkl
  unknown_nodes_path: ./data/PEMS-BAY/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v

training:
  device: cuda:0
  seed: 32
  stop_based: val_lifecycle
  loss: mse
  lr: 0.0005
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_observation_mask_feature: true
  lifecycle_age_mode: state_duration
  lifecycle_training_strategy: lcbt_v3
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_zero_history_ratio: 0.25

async_test:
  ples_protocol_version: 3
  lce_protocol_version: 3

family:
  recipe:
    use_grin_input_imputer: false
    grin_hidden_dim: 64
    grin_ff_dim: 64
    grin_layers: 1
    grin_kernel_size: 2
    grin_decoder_order: 1
    grin_merge: mlp
    grin_dropout: 0.0
    grin_ff_dropout: 0.0
    grin_layer_norm: false
    grin_use_extra_features: true
    grin_use_role_mask: true
    grin_cached_support: false
    decoder_output_mode: residual_delta
    decoder_residual_scale: 0.3
    graph_conv: lifecycle_moge
    moge_num_experts: 5
    moge_top_k: 1
    moge_router_mode: static
    moge_noisy_gating: true
    moge_load_balance_coef: 0.01
