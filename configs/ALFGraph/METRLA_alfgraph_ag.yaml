runtime:
  model: ALFGraph
  model_variant: alf_ag
  model_recipe: adaptive_graph
  mode: train
  save_model: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_mask
  batch_size: 32
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.0005
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1
  mean_expert: true
  weight_expert: false
  max_expert: false
  min_expert: false
  diffusion_expert: true
  num_used_experts: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_event_sampling: mixed
  lifecycle_training_strategy: round3_event_only
  lifecycle_aas_loss_weight: 1.0
  lifecycle_nas_loss_weight: 1.0
  lifecycle_vs_loss_weight: 1.0
  lifecycle_fs_loss_weight: 1.0

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  recipe:
    use_grin_input_imputer: true
    grin_hidden_dim: 64
    grin_ff_dim: 64
    grin_layers: 1
    grin_kernel_size: 2
    grin_decoder_order: 1
    grin_merge: mlp
    grin_dropout: 0.0
    grin_ff_dropout: 0.0
    grin_layer_norm: false
    grin_use_extra_features: true
    grin_use_role_mask: true
    grin_cached_support: false
    mogernn_router_temperature: 0.8
    decoder_output_mode: residual_delta
    decoder_residual_scale: 0.3
    cell_type: dcrnn
    use_adaptive_graph_support: true
    adaptive_graph_embed_dim: 8
    adaptive_graph_mix: 0.03
    adaptive_graph_temperature: 1.0
    adaptive_graph_symmetric: false
