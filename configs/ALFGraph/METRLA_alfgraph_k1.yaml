runtime:
  model: ALFGraph
  model_variant: alf_gsd_k1
  model_recipe: lcbt_v3_graph

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v

training:
  device: cuda:0
  seed: 32
  stop_based: val_lifecycle
  loss: mse
  lr: 0.0005
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_observation_mask_feature: true
  lifecycle_age_mode: state_duration
  lifecycle_training_strategy: lcbt_v3
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_zero_history_ratio: 0.25

async_test:
  ples_protocol_version: 3
  lce_protocol_version: 3

family:
  recipe:
    use_grin_input_imputer: false
    grin_hidden_dim: 64
    grin_ff_dim: 64
    grin_layers: 1
    grin_kernel_size: 2
    grin_decoder_order: 1
    grin_merge: mlp
    grin_dropout: 0.0
    grin_ff_dropout: 0.0
    grin_layer_norm: false
    grin_use_extra_features: true
    grin_use_role_mask: true
    grin_cached_support: false
    decoder_output_mode: residual_delta
    decoder_residual_scale: 0.3
    # Graph core. `lifecycle_moge` routes five propagation supports per node per
    # step from the lifecycle state; `diffusion` restores the single fixed
    # DiffConv operator. For the parameter-matched control set graph_conv:
    # diffusion together with d_model: 82 (370,067 vs 377,873, -2.1%).
    graph_conv: lifecycle_moge
    moge_num_experts: 5
    # Sparse routing kept; one expert summed per step instead of two.
    # Keep METRLA_alfgraph_sd.yaml (top_k=2) as the control arm.
    moge_top_k: 1
    moge_noisy_gating: true
    moge_load_balance_coef: 0.01
