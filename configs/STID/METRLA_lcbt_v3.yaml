runtime:
  model: STID
  model_variant: si_l3
  model_recipe: baseline
  mode: train
dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min
  t_mark: true
training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_lifecycle
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adam
  scheduler: None
  scheduler_patience: 1
  lr: 0.001
  weight_decay: 0.0001
  d_model: 64
async_test:
  ples_manifest_root: ./protocol_manifests
  ples_protocol_version: 2
  lce_protocol_version: 2
  ples_pre_steps: 12
  ples_post_steps: 36
  ples_seed: 2026
  ples_bootstrap_samples: 2000
  ples_bootstrap_seed: 2026
family:
  model:
    node_dim: 32
    embed_dim: 32
    num_layer: 3
    temp_dim_tid: 32
    temp_dim_diw: 32
    time_of_day_size: 1440
    day_of_week_size: 7
    if_T_i_D: true
    if_D_i_W: false
    if_node: true
lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_age_mode: state_duration
  lifecycle_observation_mask_feature: true
  lifecycle_training_strategy: lcbt_v3
  lcbt_manifest_root: ./protocol_manifests
  lcbt_protocol_seed: 2026
  lcbt_validation_seed: 12026
  lcbt_train_end_ratio: 0.50
  lcbt_val_end_ratio: 0.60
  lcbt_test_start_ratio: 0.60
  lcbt_scaler_end_ratio: 0.50
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_zero_history_ratio: 0.25
  lcbt_unseen_validation_ratio: 0.40
  lcbt_generated_unseen_fraction: 0.25
  lcbt_cohort_fractions: [0.025, 0.05, 0.10]
  lcbt_cohort_weights: [0.25, 0.50, 0.25]
  lcbt_clustered_ratio: 0.50
