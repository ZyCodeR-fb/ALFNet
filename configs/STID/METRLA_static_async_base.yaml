runtime:
  model: STID
  model_variant: stid
  model_recipe: baseline
  mode: train
  save_model: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min
  t_mark: true

training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_mask
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adam
  scheduler: None
  scheduler_patience: 1
  lr: 0.001
  weight_decay: 0.0001
  d_model: 64

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  model:
    node_dim: 32
    embed_dim: 32
    num_layer: 3
    temp_dim_tid: 32
    temp_dim_diw: 32
    time_of_day_size: 1440
    day_of_week_size: 7
    if_T_i_D: true
    if_D_i_W: false
    if_node: true
