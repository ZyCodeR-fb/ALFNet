runtime:
  model: PatchSTG
  model_variant: patchstg
  model_recipe: baseline
  mode: train
  save_model: true
  t_mark: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 30
  patience: 8
  stop_based: val_mask
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adam
  scheduler: None
  scheduler_patience: 1
  lr: 0.0001
  weight_decay: 0.0001
  d_model: 64

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: false
  lifecycle_history_age_feature: false
  lifecycle_event_sampling: mixed
  lifecycle_training_strategy: round3_event_only
  lifecycle_aas_loss_weight: 1.0
  lifecycle_nas_loss_weight: 1.0
  lifecycle_vs_loss_weight: 1.0
  lifecycle_fs_loss_weight: 1.0

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  model:
    layers: 5
    tem_patchsize: 12
    tem_patchnum: 1
    recur_times: 5
    spa_patchsize: 8
    factors: 1
    input_dims: 64
    node_dims: 32
    tod_dims: 32
    dow_dims: 32
    tod: 288
    dow: 7
