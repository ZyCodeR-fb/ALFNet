runtime:
  model: HA
  model_variant: history_inertia
  model_recipe: baseline
  mode: train
  save_model: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 1
  patience: 1
  stop_based: val_mask
  batch_size: 64
  num_workers: 8
  loss: mse
  optimizer: adam
  scheduler: None
  scheduler_patience: 1
  lr: 0.001
  weight_decay: 0.0
  d_model: 64

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  model:
    channel: null
    reverse: false
