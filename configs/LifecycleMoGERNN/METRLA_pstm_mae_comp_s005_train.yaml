runtime:
  model: LifecycleMoGERNN
  model_variant: lifecycle_adapter
  model_recipe: pstm_mae_comp
  mode: train
  save_model: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 30
  patience: 8
  stop_based: val_mask
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.0001
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_event_sampling: mixed
  lifecycle_training_strategy: round3_event_only
  lifecycle_aas_loss_weight: 1.0
  lifecycle_nas_loss_weight: 1.0
  lifecycle_vs_loss_weight: 1.0
  lifecycle_fs_loss_weight: 1.0

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  backbone:
    model: MoGERNN
    config_path: ./configs/MoGERNN/METRLA_static_async_base.yaml
    checkpoint_path: ./check_points/MoGERNN-METRLA-12-12-0-12-v-v-t_mark-False-pos_mark-False-seed-32/best_val_checkpoint.pth
  recipe:
    freeze_backbone: true
    pstm_mae_patch_size: 3
    pstm_mae_embed_dim: 64
    pstm_mae_num_heads: 4
    pstm_mae_depth: 2
    pstm_mae_mlp_ratio: 2.0
    pstm_mae_dropout: 0.0
    pstm_mae_mask_ratio: 0.5
    pstm_mae_lambda: 0.01
    pstm_mae_input_scale: 0.05
    pstm_mae_role_scale:
      aas: 0.0
      nas: 1.0
      vs: 1.0
      fs: 1.0
