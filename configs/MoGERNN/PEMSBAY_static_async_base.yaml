runtime:
  model: MoGERNN
  mode: train
  save_model: true

dataset:
  dloader_name: PEMSBAY
  data_path: ./data/PEMS-BAY/raw_data.pkl
  unknown_nodes_path: ./data/PEMS-BAY/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 200
  patience: 10
  stop_based: val_mask
  batch_size: 64
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.001
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1
  mean_expert: true
  weight_expert: true
  max_expert: true
  min_expert: true
  diffusion_expert: true
  num_used_experts: 3

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0
