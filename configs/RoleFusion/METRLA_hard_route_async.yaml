runtime:
  model: RoleFusion
  model_variant: dual_expert
  model_recipe: hard_route
  mode: test_async
  save_model: false
  t_mark: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 20
  patience: 5
  stop_based: val_mask
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.0001
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  lifecycle_role_features: true
  lifecycle_history_age_feature: true

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  experts:
    graph:
      model: MoGERNN
      config_path: ./configs/MoGERNN/METRLA_static_async_base.yaml
      checkpoint_path: ./check_points/MoGERNN-METRLA-12-12-0-12-v-v-t_mark-False-pos_mark-False-seed-32-dm64-kh1-lr1e-3-wd1e-4-bs64-ws0-cfgafa4b248/best_val_checkpoint.pth
    patch:
      model: PatchSTG
      config_path: ./configs/PatchSTG/METRLA_static_async_group3.yaml
      checkpoint_path: ./check_points/PatchSTG-var-patchstg-recipe-baseline-lifecycle_train-strategy-round3_event_only-sampling-mixed-role-0-age-0-randmask-1-METRLA-12-12-0-12-v-v-t_mark-True-pos_mark-False-seed-32-dm64-kh1-lr1e-4-wd1e-4-bs16-ws1-cfgb3f3d69e/best_val_checkpoint.pth
