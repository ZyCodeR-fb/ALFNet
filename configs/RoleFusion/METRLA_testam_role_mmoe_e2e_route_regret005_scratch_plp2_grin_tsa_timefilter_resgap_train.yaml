runtime:
  model: RoleFusion
  model_variant: rf_s_plp2grintf
  model_recipe: testam_role_mmoe
  mode: train
  save_model: true
  t_mark: true

dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_mask
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.00005
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_event_sampling: mixed
  lifecycle_training_strategy: round3_event_only
  lifecycle_aas_loss_weight: 1.0
  lifecycle_nas_loss_weight: 1.0
  lifecycle_vs_loss_weight: 1.0
  lifecycle_fs_loss_weight: 1.0

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  experts:
    graph:
      model: MoGERNN
      config_path: ./configs/MoGERNN/METRLA_maskaware_lifecycle_grin_train.yaml
      checkpoint_path: ""
      load_checkpoint: false
    patch:
      model: PatchSTG
      config_path: ./configs/PatchSTG/METRLA_lifecycle_patch_expert_crossformer_tsa_timefilter.yaml
      checkpoint_path: ""
      load_checkpoint: false
  model:
    state_hidden_dim: 32
    state_dim: 32
    gate_hidden_dim: 32
    graph_refiner_hidden_dim: 32
    temporal_refiner_hidden_dim: 32
  recipe:
    end_to_end: true
    graph_expert_lr: 0.0005
    patch_expert_lr: 0.0001
    gate_lr: 0.00005
    expert_train_mode: true
    fusion_mode: graph_patch_residual
    patch_residual_mode: gap
    patch_residual_role_scale:
      aas: 0.20
      nas: 0.00
      vs: 0.00
      fs: 0.35
    lambda_patch_residual: 0.0
    use_role_residual: false
    forecast_loss_mode: role_balanced_mix
    forecast_role_balanced_beta: 0.10
    lambda_prior: 0.0
    lambda_entropy: 0.0
    lambda_oracle: 0.0
    lambda_testam: 0.0
    lambda_route: 0.05
    route_target: hard_bce
    lambda_regret: 0.05
    lambda_residual: 0.0
    residual_scale: 0.0
    use_graph_expert_diffusion_refiner: true
    graph_diffusion_steps: 1
    graph_diffusion_scale: 0.05
    graph_diffusion_role_scale:
      aas: 0.0
      nas: 1.0
      vs: 1.0
      fs: 0.25
    use_patch_expert_temporal_refiner: true
    temporal_refiner_kernel_size: 3
    temporal_refiner_dilation: 1
    temporal_refiner_scale: 0.05
    temporal_refiner_role_scale:
      aas: 1.0
      nas: 0.25
      vs: 0.0
      fs: 1.0
    role_graph_alpha_floor:
      aas: 0.0
      nas: 0.0
      vs: 0.0
      fs: 0.0
    role_graph_prior:
      aas: 0.3
      nas: 0.7
      vs: 0.8
      fs: 0.2
