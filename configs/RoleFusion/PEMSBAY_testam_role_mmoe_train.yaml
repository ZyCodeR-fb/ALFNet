runtime:
  model: RoleFusion
  model_variant: dual_expert
  model_recipe: testam_role_mmoe
  mode: train
  save_model: true
  t_mark: true

dataset:
  dloader_name: PEMSBAY
  data_path: ./data/PEMS-BAY/raw_data.pkl
  unknown_nodes_path: ./data/PEMS-BAY/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 30
  patience: 8
  stop_based: val_mask
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.00005
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_event_sampling: mixed
  lifecycle_training_strategy: round3_event_only
  lifecycle_aas_loss_weight: 1.0
  lifecycle_nas_loss_weight: 1.0
  lifecycle_vs_loss_weight: 1.0
  lifecycle_fs_loss_weight: 1.0

async_test:
  async_adaptor: base
  async_num_events: 4
  async_commissioning_k: 12
  async_event_seed: 0

family:
  experts:
    graph:
      model: MoGERNN
      config_path: ./configs/MoGERNN/PEMSBAY_static_async_base.yaml
      checkpoint_path: ./check_points/MoGERNN-PEMSBAY-12-12-0-12-v-v-t_mark-False-pos_mark-False-seed-32-*/best_val_checkpoint.pth
    patch:
      model: PatchSTG
      config_path: ./configs/PatchSTG/PEMSBAY_static_async_base.yaml
      checkpoint_path: ./check_points/PatchSTG-var-patchstg-recipe-baseline-PEMSBAY-12-12-0-12-v-v-t_mark-True-pos_mark-False-seed-32-*/best_val_checkpoint.pth
  model:
    state_hidden_dim: 32
    state_dim: 32
    gate_hidden_dim: 32
  recipe:
    lambda_prior: 0.03
    lambda_entropy: 0.003
    lambda_oracle: 0.0
    lambda_testam: 0.05
    testam_warmup_epoch: 0
    lambda_residual: 0.01
    residual_scale: 0.2
    role_graph_alpha_floor:
      aas: 0.0
      nas: 0.0
      vs: 0.0
      fs: 0.0
    role_graph_prior:
      aas: 0.3
      nas: 0.7
      vs: 0.8
      fs: 0.2
