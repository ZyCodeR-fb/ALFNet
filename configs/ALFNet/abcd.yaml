runtime:
  model: ALFNet
  model_variant: abcd
  model_recipe: lifecycle_fusion
  mode: train
  t_mark: true
dataset:
  dloader_name: METRLA
  data_path: ./data/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min
training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_lifecycle
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  lr: 5.0e-05
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1
lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_age_mode: state_duration
  lifecycle_observation_mask_feature: true
  lifecycle_training_strategy: lcbt_v3
  lcbt_manifest_root: ./protocol_manifests
  lcbt_protocol_seed: 2026
  lcbt_validation_seed: 12026
  lcbt_train_end_ratio: 0.5
  lcbt_val_end_ratio: 0.6
  lcbt_test_start_ratio: 0.6
  lcbt_scaler_end_ratio: 0.5
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_zero_history_ratio: 0.25
  lcbt_unseen_validation_ratio: 0.4
  lcbt_generated_unseen_fraction: 0.25
  lcbt_cohort_fractions:
  - 0.025
  - 0.05
  - 0.1
  lcbt_cohort_weights:
  - 0.25
  - 0.5
  - 0.25
  lcbt_clustered_ratio: 0.5
async_test:
  ples_manifest_root: ./protocol_manifests
  ples_protocol_version: 3
  lce_protocol_version: 3
  ples_pre_steps: 12
  ples_post_steps: 36
  ples_seed: 2026
  ples_bootstrap_samples: 2000
  ples_bootstrap_seed: 2026
family:
  experts:
    graph:
      model: ALFGraph
      config_path: ./configs/ALFGraph/METRLA_alfgraph_k1.yaml
      checkpoint_path: ''
      load_checkpoint: false
    patch:
      model: ALFTemporal
      config_path: ./configs/ALFTemporal/METRLA_cond1ab.yaml
      checkpoint_path: ''
      load_checkpoint: false
  model:
    state_hidden_dim: 32
    state_dim: 32
    gate_hidden_dim: 32
    graph_refiner_hidden_dim: 32
  recipe:
    graph_expert_lr: 0.0005
    patch_expert_lr: 0.0001
    gate_lr: 5.0e-05
    fusion_mode: film
    forecast_loss_mode: role_balanced_mix
    forecast_role_balanced_beta: 0.1
    graph_diffusion_steps: 1
    graph_diffusion_scale: 0.05
    graph_diffusion_role_scale:
      aas: 0.0
      nas: 1.0
      vs: 1.0
      fs: 0.25
    evidence_router: true
    detach_imputer_for_temporal: true
    self_evidence_floor: 0.02
    lambda_route: 0.05
    router_lr: 0.0005
    patch_residual_scale: 1.0
    observed_nlinear: true
    observed_residual_scale: 0.35
