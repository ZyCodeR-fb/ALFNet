# GENERATED by scripts/build_router_configs.py -- edit the base config instead.
#
# Differs from fg1_bay.yaml in the graph expert's config path alone; that file in
# turn differs from its own base in `moge_router_mode` alone. Nothing else
# about the model, the objective or the protocol moves.
runtime:
  model: ALFNet
  model_variant: gm_bay
  model_recipe: lifecycle_fusion
  mode: train
  t_mark: true

# PEMS-BAY twin of fg1.yaml -- the confirmation run for the mainline.
#
# Everything outside the dataset block and the two expert config paths is
# byte-identical to fg1.yaml on purpose: METR-LA has been inspected many times
# and is a development set, so the second dataset only means something if no
# capacity, learning rate or protocol ratio was retuned for it.
#
# The protocol *ratios* are shared; the resulting absolute numbers are not, and
# must not be copied across. LCBT derives them from this dataset:
#   nodes 325 (vs 207), steps 52,116 (vs 34,272)
#   unknown nodes 81 (vs 50) -> ~32 validation-unseen / ~49 test-unseen
#   split steps train[0:26058] val[26058:31269] test[31269:52116]
#   cohort sizes round(0.025/0.05/0.10 * n) recomputed from 325
# and therefore writes its own training_protocol_hash, which is *expected* to
# differ from METR-LA's 59c55e6e... Never reuse METR-LA's manifest here.

dataset:
  dloader_name: PEMSBAY
  data_path: ./data/PEMS-BAY/raw_data.pkl
  unknown_nodes_path: ./data/PEMS-BAY/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 12
  input_features: v
  target_features: v
  freq: min

training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_lifecycle
  batch_size: 16
  num_workers: 8
  loss: mse
  optimizer: adamw
  scheduler: None
  lr: 0.00005
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1

lifecycle:
  train_for_async_lifecycle: true
  lifecycle_role_features: true
  lifecycle_history_age_feature: true
  lifecycle_age_mode: state_duration
  lifecycle_observation_mask_feature: true
  lifecycle_training_strategy: lcbt_v3
  lcbt_manifest_root: ./protocol_manifests
  lcbt_protocol_seed: 2026
  lcbt_validation_seed: 12026
  lcbt_train_end_ratio: 0.50
  lcbt_val_end_ratio: 0.60
  lcbt_test_start_ratio: 0.60
  lcbt_scaler_end_ratio: 0.50
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_zero_history_ratio: 0.25
  lcbt_unseen_validation_ratio: 0.40
  lcbt_generated_unseen_fraction: 0.25
  lcbt_cohort_fractions: [0.025, 0.05, 0.10]
  lcbt_cohort_weights: [0.25, 0.50, 0.25]
  lcbt_clustered_ratio: 0.50

async_test:
  ples_manifest_root: ./protocol_manifests
  ples_protocol_version: 3
  lce_protocol_version: 3
  ples_pre_steps: 12
  ples_post_steps: 36
  ples_seed: 2026
  ples_bootstrap_samples: 2000
  ples_bootstrap_seed: 2026

family:
  experts:
    graph:
      model: ALFGraph
      config_path: ./configs/ALFGraph/PEMSBAY_alfgraph_static.yaml
      checkpoint_path: ""
      load_checkpoint: false
    patch:
      model: ALFTemporal
      config_path: ./configs/ALFTemporal/PEMSBAY_cond1.yaml
      checkpoint_path: ""
      load_checkpoint: false
  model:
    state_hidden_dim: 32
    state_dim: 32
    gate_hidden_dim: 32
    graph_refiner_hidden_dim: 32
  recipe:
    graph_expert_lr: 0.0005
    patch_expert_lr: 0.0001
    gate_lr: 0.00005
    fusion_mode: film
    forecast_loss_mode: role_balanced_mix
    forecast_role_balanced_beta: 0.10
    graph_diffusion_steps: 1
    graph_diffusion_scale: 0.05
    graph_diffusion_role_scale: {aas: 0.0, nas: 1.0, vs: 1.0, fs: 0.25}
