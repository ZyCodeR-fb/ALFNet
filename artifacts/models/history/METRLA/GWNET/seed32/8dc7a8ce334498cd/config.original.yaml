runtime:
  model: GWNET
  model_variant: metrla_wave_screen_gwnet_mae
  model_recipe: source_wave_screen_v1
  mode: train
  t_mark: false
dataset:
  dloader_name: METRLA
  data_path: ./data_v4/METR-LA/raw_data.pkl
  unknown_nodes_path: ./data_v4/METR-LA/unknown_nodes.npy
  input_len: 12
  pred_len: 12
  look_back: 0
  slide_step: 1
  input_features: v
  target_features: v
  freq: min
training:
  device: cuda:0
  seed: 32
  max_epoch: 100
  patience: 10
  stop_based: val_lifecycle
  batch_size: 64
  num_workers: 0
  loss: mae
  optimizer: adamw
  scheduler: None
  scheduler_patience: 1
  lr: 0.001
  weight_decay: 0.0001
  d_model: 64
  e_layers: 2
  d_layers: 1
  k_hop: 1
  teacher_forcing_mode: free_run
  teacher_forcing_decay_epochs: 40
  early_stopping_start_epoch: 40
lifecycle:
  train_for_async_lifecycle: false
  lifecycle_role_features: false
  lifecycle_history_age_feature: false
  lifecycle_observation_mask_feature: false
  lifecycle_age_mode: state_duration
  lifecycle_training_strategy: lcbt_v4
  lcbt_validation_seed: 12026
  lcbt_train_end_ratio: 0.6
  lcbt_val_end_ratio: 0.8
  lcbt_test_start_ratio: 0.8
  lcbt_scaler_end_ratio: 0.6
  lcbt_zero_history_ratio: 0.25
  lcbt_steady_ratio: 0.25
  lcbt_join_ratio: 0.25
  lcbt_fault_ratio: 0.25
family:
  model:
    adj_type: doubletransition
    adp_adj: true
    dropout: 0.3
    residual_channels: 32
    dilation_channels: 32
    skip_channels: 256
    end_channels: 512
    kernel_size: 2
    blocks: 4
    layers: 2
