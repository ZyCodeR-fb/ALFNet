      checkpoint_path: ''
      load_checkpoint: false
  model:
    state_hidden_dim: 32
    state_dim: 32
    gate_hidden_dim: 32
    graph_refiner_hidden_dim: 32
  recipe:
    graph_expert_lr: 0.0005
    patch_expert_lr: 0.0001
    gate_lr: 5.0e-05
    fusion_mode: film
    forecast_loss_mode: role_balanced_mix
    forecast_role_balanced_beta: 0.1
    graph_diffusion_steps: 1
    graph_diffusion_scale: 0.05
    graph_diffusion_role_scale:
      aas: 0.0
      nas: 1.0
      vs: 1.0
      fs: 0.25
    forecast_scale_loss_mode: signed_log_huber
    forecast_scale_loss_weight: 0.05
